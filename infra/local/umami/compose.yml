name: openmentor-local-umami
services:
  db:
    image: postgres:16.14-alpine
    restart: "no"
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?private .env required}
    volumes: ['database:/var/lib/postgresql/data']
    networks: [analytics]
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 100
    security_opt: ['no-new-privileges:true']
    command: [postgres, -c, shared_buffers=32MB, -c, max_connections=30]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U umami -d umami']
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
  app:
    image: ghcr.io/umami-software/umami:3.4.1@sha256:e69d1a7932e9dab0fc523edc7be1f3a53f3c261f57856fc2167ae74a8fc022e8
    platform: linux/arm64
    restart: "no"
    init: true
    ports: ['127.0.0.1:18185:3000']
    environment:
      DATABASE_URL: postgresql://umami:${POSTGRES_PASSWORD:?private .env required}@db:5432/umami?connection_limit=5
      APP_SECRET: ${APP_SECRET:?private .env required}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:?private .env required}
      DISABLE_TELEMETRY: '1'
      DISABLE_UPDATES: '1'
      NODE_OPTIONS: --max-old-space-size=384
    networks: [analytics]
    depends_on:
      db: {condition: service_healthy}
    mem_limit: 640m
    cpus: 0.75
    pids_limit: 100
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://localhost:3000/api/heartbeat").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
networks:
  analytics:
volumes:
  database:
